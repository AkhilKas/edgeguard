[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeguard"
version = "0.1.0"
description = "On-device prompt injection detection for edge LLM deployments"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.2.90",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "arduino-router-bridge>=0.5.0",
    "pyyaml>=6.0.1",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml",
]

[project.scripts]
edgeguard = "edgeguard.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Training notebooks are exploratory/Colab-authored, not application code —
# don't hold them to the same lint/format gate as src/ and tests/.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() pattern relies on function calls in argument defaults.
"src/edgeguard/api/server.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*", "llama_cpp.*", "arduino.router_bridge.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/edgeguard --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/edgeguard"]
omit = ["*/tests/*"]
