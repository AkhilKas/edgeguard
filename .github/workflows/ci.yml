name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      # ── Type check ────────────────────────────────────────────────────────
      - name: Mypy
        run: mypy src/edgeguard

      # ── Tests ─────────────────────────────────────────────────────────────
      # llama-cpp-python requires a model file; unit tests use MockLLM
      # so no model download is needed in CI.
      - name: Unit tests
        env:
          LLM_MODEL_PATH: "tests/fixtures/dummy.gguf"   # see conftest
          MCU_ENABLED: "false"
        run: |
          # Create a dummy model file so settings validation passes
          mkdir -p tests/fixtures
          touch tests/fixtures/dummy.gguf
          pytest tests/unit/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
